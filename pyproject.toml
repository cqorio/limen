[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "limen"
version = "1.2.0"
description = "Lightweight, modular abuse-defense engine for your API: toggleable guards, shadow/enforce modes, zero core deps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["security", "rate-limiting", "abuse", "bot-detection", "enumeration", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []  # the core is stdlib-only

[project.optional-dependencies]
redis = ["redis>=4.2"]
fastapi = ["starlette>=0.27"]
prometheus = ["prometheus_client>=0.16"]
sentry = ["sentry-sdk>=2,<4"]  # new_scope() API; push_scope (removed in 3.0) is not used
# dev pulls in every optional extra so `pip install -e '.[dev]'` runs the WHOLE test suite (redis/fastapi/
# prometheus/sentry paths included, nothing skipped). httpx is needed by Starlette's TestClient (test_challenge).
dev = ["limen[redis,fastapi,prometheus,sentry]", "pytest>=7", "httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/cqorio/limen"
Repository = "https://github.com/cqorio/limen"
Issues = "https://github.com/cqorio/limen/issues"

[tool.setuptools.packages.find]
include = ["limen*"]

[tool.setuptools.package-data]
limen = ["py.typed"]
